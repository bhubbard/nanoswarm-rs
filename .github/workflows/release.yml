name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Binary (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Compile Release Binary
        run: cargo build --release --locked

      - name: Package Binary Artifact
        run: |
          mkdir -p dist
          tar -czvf "dist/nanoswarm-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz" -C target/release nanoswarm
          cd dist
          shasum -a 256 "nanoswarm-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz" > "nanoswarm-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
